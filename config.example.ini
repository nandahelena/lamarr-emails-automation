; ============================================================
; Config de envio - Projeto Lamarr
; ============================================================
; 1) Copie este arquivo para "config.ini"
; 2) Preencha os dados abaixo
; 3) NUNCA compartilhe o config.ini nem suba ele para o GitHub
;
; --- Gmail ---
; smtp_host = smtp.gmail.com
; smtp_port = 587
; Gmail exige uma "senha de app" (não é a senha normal da conta):
;   1. Ative a verificação em duas etapas: myaccount.google.com/security
;   2. Gere uma senha de app em: myaccount.google.com/apppasswords
;   3. Use essa senha de 16 letras no campo smtp_password abaixo
;
; --- Outlook / Hotmail ---
; smtp_host = smtp.office365.com
; smtp_port = 587
;
; --- Outro provedor ---
; Pergunte ao seu provedor de e-mail o host e a porta SMTP (geralmente 587)

[smtp]
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user = smtp.user@gmail.com
smtp_password = cole sua senha aqui

[envio]
; Nome e e-mail que aparecem como remetente
remetente_nome = Projeto Lamarr
remetente_email = smtp.user@gmail.com

; Assunto do e-mail
assunto = Projeto Lamarr | Seja bem-vinda!

; Segundos de espera entre um envio e outro (evita bloqueio por spam)
delay_segundos = 3
